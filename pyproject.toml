[project]
name = "drf-serializer-shaper"
version = "0.1.2"
description = "Dynamic nested include/exclude for DRF serializers"
authors = [{ name = "Nafisa Alam" }]
dependencies = ["djangorestframework>=3.14"]
readme = "README.md"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project.urls]
"Homepage" = "https://github.com"

[tool.setuptools.packages.find]
where = ["src"]
